name: CI

# CI fires on EVERY branch push, not just `master`. `loop.sh` and `/next-items`
# push their work to feature and per-item batch branches and only open a PR at the
# end, so a `master`-only push trigger meant the MAJORITY of commits never met CI
# at all — the gates existed but did not run, which is the failure mode the whole
# learning loop is built to prevent (.claude/LESSONS.md, "Graduation ledger").
#
# `'**'` rather than an enumerated prefix list, deliberately. A list has to be
# maintained against a naming convention that drifts, and its failure mode is
# SILENT: a new prefix means pushes skip CI and nobody finds out until a red
# master. That is the same shape as the hole this trigger exists to close, so the
# fix removes the category instead of patching instances — the pattern of the
# skill-value graduation in CLAUDE.md, where the answer was not "be more careful
# with the list" but "make the list unnecessary".
#
# Measured, for anyone who ever wants to narrow it again: history holds 16 slash
# prefixes (feat 142, claude 88, fix 45, docs 25, refactor 22, chore 17, bug 12,
# wt 7, then blog/plan/rename/... at 1-2 each), ~25 single-segment names
# (`spec-gap-fixes`, `loans-ccf-fix`, ...), `worktree-*` from EnterWorktree, and
# GitHub's auto-generated `revert-<PR#>-<branch>`. Re-derive the prefix histogram
# with:
#
#   git log --merges --format='%s' | grep -oP 'OpenAfterHours/\K[^/]+(?=/)' \
#     | sort | uniq -c | sort -rn
#
# Note that naming a `branches` filter at all is what keeps TAG pushes from
# triggering this workflow: `branches` and `tags` are separate filters, and a tag
# push matches no branch pattern. A bare `on: push:` would fire the whole suite on
# every release tag.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

# Keyed on `github.ref`, which is per-branch (`refs/heads/feat/x`) and so
# partitions every branch correctly under `'**'` with no change. Deliberately NOT
# collapsed with the PR event's ref, which is `refs/pull/<n>/merge`: the two events
# are in separate groups today and cannot cancel each other, whereas a shared group
# would let whichever run STARTS LATER cancel the earlier one — so the victim could
# be either the push run or the pull_request run, and branch protection reads a
# cancelled required check as "not passing". The cost is that pushing to a branch
# with an open PR runs CI twice on that commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff check
        run: uv run ruff check src/ tests/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

      - name: Architectural invariants
        run: uv run python scripts/arch_check.py

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4

      - name: Install dependencies
        run: uv sync --extra dev

      - name: ty
        run: uv run ty check src/rwa_calc/

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Generate test fixtures
        run: uv run python tests/fixtures/generate_all.py

      # `-n auto` overrides the `-n 8` default in addopts, which is tuned for the
      # RAM-constrained dev box. The runner has a different core-to-RAM ratio, so
      # it keeps sizing the fleet from its own core count; the Polars thread cap
      # in tests/conftest.py still applies and is a win here too.
      - name: Run tests
        run: uv run pytest tests/ --benchmark-disable -m 'not slow and not benchmark' -n auto

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Generate test fixtures
        run: uv run python tests/fixtures/generate_all.py

      # addopts is cleared so xdist and --benchmark-disable don't suppress
      # pytest-benchmark; scale_1m benchmarks stay excluded via 'not slow'.
      #
      # POLARS_MAX_THREADS is set explicitly so the `setdefault` in
      # tests/conftest.py does not apply: benchmarks measure production-like
      # throughput and need the real thread pool, not the dev-loop cap of 1.
      - name: Run benchmarks
        run: |
          export POLARS_MAX_THREADS="$(nproc)"
          uv run pytest tests/benchmarks -m 'benchmark and not slow' -o addopts= --benchmark-json=benchmark-results.json -v --tb=short

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.json
          if-no-files-found: error

  spill:
    name: Spill-Edge Parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4

      - name: Install dependencies
        run: uv sync --extra dev

      # Exercises the spill-to-parquet edge path (config.spill_edges) so a
      # SpillError regression surfaces here, not in production out-of-core
      # runs. addopts is cleared so the marker filter / xdist defaults don't
      # interfere with this targeted run; both files use in-memory builders,
      # so no fixture generation step is needed.
      - name: Spill parity + materialise tests
        run: uv run pytest tests/integration/test_spill_edges_parity.py tests/unit/test_materialise.py -q -o addopts=

  template-coverage:
    name: Template Cell Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Generate test fixtures
        run: uv run python tests/fixtures/generate_all.py

      # Two-way ratchet on which (template, column) pairs any portfolio ever
      # populates: a live column going dead is a regression, a dead one going
      # live must be banked. The census walks 12 portfolios x 2 regimes through
      # the real COREP and Pillar 3 generators -- measured 361s -- so it is
      # marked `slow` and the dev loop and the `test` job both exclude it.
      # This job is therefore the ONLY place the ratchet actually executes, and
      # without it the gate would exist without ever running, which is the
      # failure mode it was built to prevent (.claude/LESSONS.md B5).
      #
      # Invoked as the script rather than through `pytest -m slow` on purpose:
      # the exit code is then the gate's own, there is no marker plumbing to get
      # wrong, and the check stays legible to a reader who has never seen this
      # project's pytest markers.
      - name: Template cell-coverage ratchet
        run: uv run python scripts/check_template_cell_coverage.py --check

  coverage-ratchet:
    name: Reporting Coverage Ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Generate test fixtures
        run: uv run python tests/fixtures/generate_all.py

      # Four-way ratchet on how much of the estate the gates can actually SEE,
      # measured over the same portfolio x regime matrix the supervisory register
      # runs (`RUNS`, imported not re-declared): binding rules per regime and
      # template-cell liveness may not FALL, dead cells and never-evaluated rules
      # may not RISE.
      #
      # Until this job existed, `--check` was implemented and invoked by nothing —
      # absent from ci.yml, from arch_check.py and from every test — so a change
      # could kill a live cell, un-bind a published rule, or open a new blind spot
      # with every gate still green. That is LESSONS B5 in its purest form: the
      # register FAILS OPEN, and an unreachable rule is indistinguishable from a
      # clean estate.
      #
      # It is a separate job rather than a step in `test` because it drives 24 full
      # pipeline runs (16 portfolio x regime combinations plus a prior-period run
      # for each of the 8 with IRB permission) and both reporting generators. It is
      # invoked as the script, not through pytest, so the exit code is the gate's
      # own — the sibling `slow` contract test in
      # tests/contracts/test_coverage_ratchet.py is the local-dev mirror.
      - name: Reporting coverage ratchet
        run: uv run python scripts/coverage_report.py --check
