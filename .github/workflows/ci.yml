name: CI

# CI fires on EVERY branch push, not just `master`. `loop.sh` and `/next-items`
# push their work to feature and per-item batch branches and only open a PR at the
# end, so a `master`-only push trigger meant the MAJORITY of commits never met CI
# at all — the gates existed but did not run, which is the failure mode the whole
# learning loop is built to prevent (.claude/LESSONS.md, "Graduation ledger").
#
# `'**'` rather than an enumerated prefix list, deliberately. A list has to be
# maintained against a naming convention that drifts, and its failure mode is
# SILENT: a new prefix means pushes skip CI and nobody finds out until a red
# master. That is the same shape as the hole this trigger exists to close, so the
# fix removes the category instead of patching instances — the pattern of the
# skill-value graduation in CLAUDE.md, where the answer was not "be more careful
# with the list" but "make the list unnecessary".
#
# Measured, for anyone who ever wants to narrow it again: history holds 16 slash
# prefixes (feat 142, claude 88, fix 45, docs 25, refactor 22, chore 17, bug 12,
# wt 7, then blog/plan/rename/... at 1-2 each), ~25 single-segment names
# (`spec-gap-fixes`, `loans-ccf-fix`, ...), `worktree-*` from EnterWorktree, and
# GitHub's auto-generated `revert-<PR#>-<branch>`. Re-derive the prefix histogram
# with:
#
#   git log --merges --format='%s' | grep -oP 'OpenAfterHours/\K[^/]+(?=/)' \
#     | sort | uniq -c | sort -rn
#
# Note that naming a `branches` filter at all is what keeps TAG pushes from
# triggering this workflow: `branches` and `tags` are separate filters, and a tag
# push matches no branch pattern. A bare `on: push:` would fire the whole suite on
# every release tag.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

# Keyed on `github.ref`, which is per-branch (`refs/heads/feat/x`) and so
# partitions every branch correctly under `'**'` with no change. Deliberately NOT
# collapsed with the PR event's ref, which is `refs/pull/<n>/merge`: the two events
# are in separate groups today and cannot cancel each other, whereas a shared group
# would let whichever run STARTS LATER cancel the earlier one — so the victim could
# be either the push run or the pull_request run, and branch protection reads a
# cancelled required check as "not passing". The cost is that pushing to a branch
# with an open PR runs CI twice on that commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4

      - name: Install dependencies
        run: uv sync --extra dev

      # `packages/` is the uv workspace member tree (packages/rwa-filer). It is
      # linted under the ROOT ruff configuration: a member pyproject.toml carries
      # no [tool.ruff] table, so ruff resolves upward to this one.
      - name: Ruff check
        run: uv run ruff check src/ tests/ packages/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/ packages/

      - name: Architectural invariants
        run: uv run python scripts/arch_check.py

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4

      - name: Install dependencies
        run: uv sync --extra dev

      - name: ty
        run: uv run ty check src/rwa_calc/

      - name: ty (rwa-filer)
        run: uv run ty check packages/rwa-filer/src/

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Generate test fixtures
        run: uv run python tests/fixtures/generate_all.py

      # `-n auto` overrides the `-n 8` default in addopts, which is tuned for the
      # RAM-constrained dev box. The runner has a different core-to-RAM ratio, so
      # it keeps sizing the fleet from its own core count; the Polars thread cap
      # in tests/conftest.py still applies and is a win here too.
      #
      # `not robustness` for the same reason pyproject's addopts excludes it: the
      # marker filter here is an EXCLUSION list, so tests/robustness/ WOULD run
      # per-PR without this. It is a search over pathological inputs, it takes
      # tens of minutes at the `thorough` budget, and its verdict is not a
      # per-commit signal — nightly-robustness.yml owns it.
      - name: Run tests
        run: uv run pytest tests/ --benchmark-disable -m 'not slow and not benchmark and not robustness' -n auto

  rwa-filer:
    name: rwa-filer (isolated)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4

      # The whole point of this job is what it does NOT install. `uv sync
      # --package rwa-filer` builds an environment holding rwa-filer, its declared
      # dependencies and its own dev group — and nothing from rwa-calc. Every
      # other job shares one workspace environment in which rwa_calc and all of
      # its dependencies are importable, so a dependency rwa-filer forgot to
      # declare (or an import that reached back into rwa_calc) would pass there
      # and fail only for a user who installed the wheel on its own.
      - name: Install rwa-filer alone
        run: uv sync --package rwa-filer

      # Asserted outright rather than inferred from a green suite: if this ever
      # prints True the job is no longer measuring independence at all.
      - name: rwa_calc is absent from this environment
        run: |
          uv run --no-sync python -c "
          import importlib.util, sys
          found = importlib.util.find_spec('rwa_calc') is not None
          print('rwa_calc importable:', found)
          sys.exit(1 if found else 0)
          "

      # `--no-sync` so `uv run` cannot quietly re-sync the ROOT project and put
      # rwa-calc back. RWA_FILER_ISOLATED arms the environment limb of
      # packages/rwa-filer/tests/test_independence.py.
      - name: Run rwa-filer tests
        env:
          RWA_FILER_ISOLATED: "1"
        run: uv run --no-sync pytest packages/rwa-filer

      - name: Console script runs
        run: uv run --no-sync rwa-filer --version

      # The wheel a user installs is built from this member alone; prove it
      # builds, that its metadata does not name rwa-calc, and that the rule
      # extracts and the taxonomy packs ride inside it. The pack tables are
      # Arrow files precisely because the repository ignores *.parquet, and the
      # build honours the ignore file. The suite above runs against an EDITABLE
      # install, where package data is read straight from the source tree — so
      # a packaging change that dropped the JSON from the wheel would pass
      # every test and ship a rule engine with no rules.
      - name: Build the wheel and check its contents
        run: |
          uv build --package rwa-filer -o dist/rwa-filer
          python - <<'PY'
          import glob, sys, zipfile
          (wheel,) = glob.glob("dist/rwa-filer/rwa_filer-*.whl")
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
              (metadata,) = [n for n in names if n.endswith(".dist-info/METADATA")]
              requires = [
                  line for line in archive.read(metadata).decode().splitlines()
                  if line.startswith("Requires-Dist:")
              ]
          extracts = sorted(n for n in names if n.startswith("rwa_filer/rules/data/") and n.endswith(".json"))
          packs = sorted(
              n.rsplit("/", 1)[0] for n in names
              if n.startswith("rwa_filer/taxonomy/data/") and n.endswith("/pack.json")
          )
          print("\n".join(requires))
          print("\n".join(extracts))
          print("\n".join(packs))
          problems = []
          if any("rwa-calc" in line.lower() for line in requires):
              problems.append("the rwa-filer wheel declares a dependency on rwa-calc")
          if len(extracts) < 2:
              problems.append(f"expected the packaged rule extracts in the wheel, found {extracts}")
          if not packs:
              problems.append("no taxonomy pack in the wheel")
          for pack in packs:
              for member in ("cells.arrow", "datapoints.arrow"):
                  if f"{pack}/{member}" not in names:
                      problems.append(f"taxonomy pack {pack} is missing {member} in the wheel")
          for problem in problems:
              print(f"::error::{problem}")
          sys.exit(1 if problems else 0)
          PY

  wheel-install:
    name: Wheel Install (clean environment)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4

      # Every other job shares the workspace DEV environment, where the dev extra
      # and dependency group are installed, so a module that imports a dev-only
      # distribution passes all of them. That is how every rwa-calc release from
      # 0.2.24 to 0.3.34 shipped unable to import rwa_calc.api: `watchfire` (the
      # `@cites` decorator, imported at module level by 79 modules) was declared
      # only in the dev extra and group (docs/development/escape-log.md,
      # 2026-11-14).
      #
      # This job deliberately installs NOTHING itself — no `uv sync`. The script
      # builds every workspace wheel from this commit, installs each into a fresh
      # environment on its Requires-Python floor holding only what the wheel
      # declares, then imports every module the wheel ships, resolves every
      # console script, and boots the `rwa-ui` app. It is stdlib-only, so the
      # runner's own interpreter can drive it, and invoked as the script so the
      # exit code is the gate's own. publish.yml and scripts/deploy.py run it
      # again on the release itself.
      - name: Install each wheel into a clean environment and import it
        run: python scripts/check_wheel_install.py --package all

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Generate test fixtures
        run: uv run python tests/fixtures/generate_all.py

      # addopts is cleared so xdist and --benchmark-disable don't suppress
      # pytest-benchmark; scale_1m benchmarks stay excluded via 'not slow'.
      #
      # POLARS_MAX_THREADS is set explicitly so the `setdefault` in
      # tests/conftest.py does not apply: benchmarks measure production-like
      # throughput and need the real thread pool, not the dev-loop cap of 1.
      - name: Run benchmarks
        run: |
          export POLARS_MAX_THREADS="$(nproc)"
          uv run pytest tests/benchmarks -m 'benchmark and not slow' -o addopts= --benchmark-json=benchmark-results.json -v --tb=short

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.json
          if-no-files-found: error

  spill:
    name: Spill-Edge Parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4

      - name: Install dependencies
        run: uv sync --extra dev

      # Exercises the spill-to-parquet edge path (config.spill_edges) so a
      # SpillError regression surfaces here, not in production out-of-core
      # runs. addopts is cleared so the marker filter / xdist defaults don't
      # interfere with this targeted run; both files use in-memory builders,
      # so no fixture generation step is needed.
      - name: Spill parity + materialise tests
        run: uv run pytest tests/integration/test_spill_edges_parity.py tests/unit/test_materialise.py -q -o addopts=

  template-coverage:
    name: Template Cell Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Generate test fixtures
        run: uv run python tests/fixtures/generate_all.py

      # Two-way ratchet on which (template, column) pairs any portfolio ever
      # populates: a live column going dead is a regression, a dead one going
      # live must be banked. The census walks 12 portfolios x 2 regimes through
      # the real COREP and Pillar 3 generators -- measured 361s -- so it is
      # marked `slow` and the dev loop and the `test` job both exclude it.
      # This job is therefore the ONLY place the ratchet actually executes, and
      # without it the gate would exist without ever running, which is the
      # failure mode it was built to prevent (.claude/LESSONS.md B5).
      #
      # Invoked as the script rather than through `pytest -m slow` on purpose:
      # the exit code is then the gate's own, there is no marker plumbing to get
      # wrong, and the check stays legible to a reader who has never seen this
      # project's pytest markers.
      - name: Template cell-coverage ratchet
        run: uv run python scripts/check_template_cell_coverage.py --check

  branch-census:
    name: Branch Census
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Generate test fixtures
        run: uv run python tests/fixtures/generate_all.py

      # Two-way ratchet on which regulatory limb each row actually takes, across
      # 14 portfolios x 2 regimes (~45s). A limb the estate stops reaching is a
      # coverage regression; a newly declared limb no row reaches is dead code
      # or an untested path. Both are findings.
      #
      # Same reasoning as `template-coverage` above: the ratchet test is marked
      # `slow`, so the dev loop and the `test` job both skip it and this job is
      # the ONLY place it executes. Invoked as the script so the exit code is
      # the gate's own.
      - name: Branch census ratchet
        run: uv run python scripts/check_branch_census.py --check

  filing-mapping:
    name: Filing Mapping Ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Generate test fixtures
        run: uv run python tests/fixtures/generate_all.py

      # How much of the generated Basel 3.1 COREP estate has a place in the
      # PRA001 taxonomy. Every generated cell is re-addressed to the taxonomy's
      # own coordinates (table, sheet, row, column); `placed_cells` may not FALL,
      # and `unplaced_figures` - with every (template, reason) cell of its
      # breakdown - may not RISE.
      #
      # The taxonomy pack is compiled from the Bank of England's DPM files, so
      # this is the one measure of our template layout that our generators and
      # our own tests cannot drift with (LESSONS B3). A figure in a row, column
      # or sheet the taxonomy does not have cannot be filed at all, and no other
      # gate sees that.
      #
      # A separate job because it drives 13 full pipeline runs, and because
      # nothing else runs it: it is not in arch_check, and its pytest mirror
      # (tests/contracts/test_filing_mapping_ratchet.py) is `slow`-marked.
      - name: Filing-mapping ratchet
        run: uv run python scripts/filing_mapping_report.py --check

  coverage-ratchet:
    name: Reporting Coverage Ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Generate test fixtures
        run: uv run python tests/fixtures/generate_all.py

      # Four-way ratchet on how much of the estate the gates can actually SEE,
      # measured over the same portfolio x regime matrix the supervisory register
      # runs (`RUNS`, imported not re-declared): binding rules per regime and
      # template-cell liveness may not FALL, dead cells and never-evaluated rules
      # may not RISE.
      #
      # Until this job existed, `--check` was implemented and invoked by nothing —
      # absent from ci.yml, from arch_check.py and from every test — so a change
      # could kill a live cell, un-bind a published rule, or open a new blind spot
      # with every gate still green. That is LESSONS B5 in its purest form: the
      # register FAILS OPEN, and an unreachable rule is indistinguishable from a
      # clean estate.
      #
      # It is a separate job rather than a step in `test` because it drives 24 full
      # pipeline runs (16 portfolio x regime combinations plus a prior-period run
      # for each of the 8 with IRB permission) and both reporting generators. It is
      # invoked as the script, not through pytest, so the exit code is the gate's
      # own — the sibling `slow` contract test in
      # tests/contracts/test_coverage_ratchet.py is the local-dev mirror.
      - name: Reporting coverage ratchet
        run: uv run python scripts/coverage_report.py --check
