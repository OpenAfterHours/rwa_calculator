name: Deploy Documentation

on:
  push:
    branches: [master, main]
    paths:
      - "docs/**"
      - "zensical.toml"
      - "src/rwa_calc/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/checkout@v5

      # An exact minor, never `3.x`: `3.x` resolves to the newest CPython on the
      # runner, so this job's interpreter moved with no commit the day 3.15
      # reached it, and `uv sync` failed building `loro` (marimo's dependency),
      # which had no 3.15 wheel. 3.14 is what CI's jobs run (the runner image's
      # python3), so the site builds against the dependency set CI installs.
      # tests/contracts/test_workflow_python_pins.py gates the floating form.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4

      - name: Install dependencies
        run: uv sync --group dev

      - name: Build documentation
        run: uv run zensical build --clean

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
