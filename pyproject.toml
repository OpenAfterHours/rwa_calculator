[project]
name = "rwa-calc"
version = "0.3.33"
description = "Basel 3.1 Credit Risk RWA Calculator compliant with PRA PS1/26"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "Apache-2.0"}
authors = [
    {name = "OpenAfterHours"}
]
maintainers = [
    {name = "OpenAfterHours"}
]
keywords = ["basel", "rwa", "credit-risk", "pra", "regulatory", "capital", "banking", "risk-management", "polars"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "polars>=1.0.0",
    "polars-normal-stats>=0.2.0",  # Required for IRB statistical functions
    "fastexcel>=0.19.0",
    "xlsxwriter>=3.1.0",
    "zensical>=0.0.30",
    "fastapi>=0.135.3",
    "itsdangerous>=2.2.0",
    "uvicorn>=0.40.0",
    "jinja2>=3.1.0",  # server-rendered read-only UI (rwa-ui)
    "python-multipart>=0.0.9",  # FastAPI form parsing for the calculator
    "marimo>=0.19.6",
]

[project.scripts]
rwa-ui = "rwa_calc.ui.app.main:main"
rulepack-diff = "rwa_calc.rulebook.audit:main"

[project.urls]
Homepage = "https://github.com/OpenAfterHours/rwa_calculator"
Documentation = "https://OpenAfterHours.github.io/rwa_calculator/"
Repository = "https://github.com/OpenAfterHours/rwa_calculator.git"
Issues = "https://github.com/OpenAfterHours/rwa_calculator/issues"
Changelog = "https://github.com/OpenAfterHours/rwa_calculator/blob/master/docs/appendix/changelog.md"

[project.optional-dependencies]
ui = [
    "marimo>=0.5.0",
    "uvicorn>=0.27.0",
    "fastapi>=0.115.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pytest-benchmark>=4.0.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.3.0",
    "ty",
    "httpx>=0.27.0",  # FastAPI TestClient (REST API tests)
    "zensical>=0.0.29",
    "mkdocstrings[python]>=0.24.0",
    "numpy>=1.26.0",  # For benchmark data generation only
    "watchfire==0.3.1",
    "hypothesis>=6.100.0",  # tests/properties/ portfolio search + shrinking
]
all = [
    "rwa-calc[ui,dev]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rwa_calc"]

# Allowlist, not a blocklist. Hatchling honours the ROOT .gitignore only, so a
# nested ignore (tmp/.gitignore is a bare `*`) never reaches it: with no sdist
# target declared at all, `uv build` swallowed the whole working tree — 208 MB
# carrying a uv cache whose venv holds absolute symlinks (which fails the build
# outright) and, worse, shell and git config that must never be published. A
# blocklist would have to grow a row for every new scratch directory; this only
# ever ships what is named here.
[tool.hatch.build.targets.sdist]
# Every pattern is root-anchored with a leading slash. These are gitignore-style
# patterns, so a bare `src` matches a directory of that name at ANY depth — and
# `tmp/worktrees/*/` and `.claude/worktrees/*/` hold whole repo clones from past
# /next-items batches, each with its own src/, tests/ and docs/. Unanchored
# patterns pull all of them back in.
include = [
    "/src",
    "/tests",
    "/scripts",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
    "/uv.lock",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]
exclude = ["workbooks"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "G",      # flake8-logging-format — forbid f-strings / % inside log calls
    "LOG",    # flake8-logging — catches deprecated/misused logging APIs
    "T20",    # flake8-print — ban print() outside allowed files
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20", "G"]                  # test debugging prints / f-string logs are OK
"scripts/**" = ["T20", "G"]                # CLI scripts print user-facing output
"scratch_barrier/**" = ["T20"]             # scratch diagnostic scripts print tab-separated traces

[tool.ruff.lint.isort]
known-first-party = ["rwa_calc"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# -n is fixed rather than `auto` on purpose: `auto` sizes the fleet from the
# core count, but the binding constraint is RAM (the reference dev box is 16
# cores to 7.8 GB). With the Polars thread cap in tests/conftest.py, 8 workers
# cost ~28s against 16 but give back ~2 GB of peak and leave the machine usable
# while the suite runs. Override per-invocation with `-n auto` / `-n 0`.
# The marker filter is an EXCLUSION list, so a newly-registered marker runs by
# default unless it is named here. `robustness` is excluded because that suite is
# a SEARCH over pathological inputs rather than a regression check — it runs
# nightly (.github/workflows/nightly-robustness.yml), not in the dev loop.
addopts = "--tb=short --strict-markers --benchmark-disable -m 'not slow and not stress and not scale_1m and not benchmark and not robustness' -n 8 --dist=loadfile"
markers = [
    "benchmark: mark test as a benchmark (excluded from the default dev loop; run via -m benchmark)",
    "robustness: input-pathology fuzzing over the full pipeline (tests/robustness/; nightly, not the dev loop; run via -m robustness)",
    "slow: mark test as slow (1M scale, may take several minutes)",
    "stress: mark test as a correctness-at-scale validation (10K+ rows, opt-in; CI runs with -m 'not slow')",
    "scale_10k: benchmark at 10K counterparty scale",
    "scale_100k: benchmark at 100K counterparty scale",
    "scale_1m: benchmark at 1M counterparty scale (opt-in via -m scale_1m; ~60s+ run, ~1.5 GB peak memory)",
]

[tool.coverage.run]
source = ["src/rwa_calc"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
# Marimo workbooks and generated fixtures excluded from type checking
# (equivalent to mypy ignore_errors)
exclude = [
    "workbooks",
    "tests/fixtures/generate_all.py",
    "tests/fixtures/*/generate_all.py",
]

[tool.watchfire]
# Static-analysis citation validator (watchfire check / watchfire matrix).
# Pin matches the bundled rulebook snapshot the pilot annotations were
# written against; bump when upstream ships an updated PS / PRA Rulebook index.
rulebook_version = "2026-05-15"
instruments = ["CRR", "PS", "PRA_RULEBOOK", "SS"]
source_paths = ["src/rwa_calc/engine"]

[dependency-groups]
dev = [
    "zensical>=0.0.29",
    "mkdocstrings[python]>=1.0.0",
    "pytest-benchmark>=5.2.3",
    "pytest-xdist>=3.5.0",  # addopts pass -n auto --dist=loadfile; must be in the default-synced group
    "numpy>=1.26.0",  # For benchmark data generation only
    "pymupdf>=1.27.2.2",
    "ruff>=0.14.14",
    "curfew>=0.1.0",
    "watchfire==0.3.1",  # arch_check pre-commit gate runs `watchfire check`; must be in the default-synced group
    "httpx>=0.27.0",  # FastAPI TestClient; the REST/UI test gate needs it in the default-synced group
    "psutil>=5.9.0",  # scripts/profile_memory.py peak-RSS sampling (degrades gracefully if absent)
    "openpyxl>=3.1.5",  # scripts/extract_validation_rules.py reads the EBA/BoE rule workbooks
    "hypothesis>=6.100.0",  # tests/properties/ runs in the default gate; must be default-synced
]
