sonar.projectKey=OpenAfterHours_rwa_calculator
sonar.organization=openafterhours

# Analysis scope
#   src + scripts are production code; tests are classified as test sources so
#   test-only findings are not counted as production issues. Keeping the three
#   roots disjoint avoids the "path in both sources and tests" analysis error.
sonar.sources=src,scripts
sonar.tests=tests

# Copy-paste detection (CPD)
#   Test fixtures and scenario tests are intentionally explicit and
#   self-contained — each regulatory scenario carries its own hand-calc data and
#   pipeline setup, so per-scenario repetition is by-design (not a defect).
#   Exclude tests from duplication detection only (analysis/coverage unaffected).
sonar.cpd.exclusions=tests/**

# Issue-rule suppressions
#   e1: S101 (PascalCase class names) — test classes use TestB31M01_, etc.
#   e2: S125 (commented-out code) — explanatory hand-calc comments in tests
#        (e.g. "# 3500 - 45 = 3455") trigger false positives; the comments
#        are required documentation of the expected value.
#   e3: S2259 (null dereference) — test setup guarantees non-None for dict
#        accesses (e.g. `result["ead_final"]` after `if result is None:
#        pytest.skip(...)`). Sonar's data-flow analysis does not track
#        narrowing through pytest.skip / fixture-loader helpers.
#   e4: S1244 (float equality) — test assertions on regulatory parameters
#        (`assert df["risk_weight"][0] == 0.50`) require exact equality to
#        the documented input value, not an approx-equal comparison.
#   e5: S5332 (clear-text protocol) — the UI launcher opens/logs the local
#        loopback URL (http://127.0.0.1:8000). The server binds to localhost
#        only and has no TLS; HTTPS is not applicable to a local dev server.
# NOTE on S6549 / S2083 (path constructed from user-controlled data): the loader's
#   ``base_path`` and the reconciliation ``legacy_file`` are the data directory
#   / legacy-output file the OPERATOR points this local, single-process tool at;
#   likewise the per-user state files under ``$RWA_STATE_DIR`` (the calculator /
#   reconciliation last-run prefills and the sign-off store
#   ``reconciliation_signoff.json``) write a CONSTANT filename into an
#   operator/packager/test-set directory (ui/app/*_state.py, recon_signoff.py)
#   (api/rest.py design notes: "the local ... tool the UI ships as"; server
#   binds localhost-only, cf. e5) — the path IS the trust root, so there is no
#   enclosing directory to confine it within. These are TAINT-engine findings
#   (pythonsecurity:*) and CANNOT be excluded from this file under SonarCloud
#   Automatic Analysis; they are resolved as "Accepted" in the SonarCloud
#   platform instead. If the REST API is ever exposed to untrusted callers this
#   MUST be revisited with a real containment root + traversal rejection.
#   NOT every S2083 here is an accept, though — prefer the structural fix and
#   accept only when the path genuinely IS the trust root, or when the reported
#   flow is not about a path at all (see the next paragraph). ``type=Path`` CLI
#   arguments in ``scripts/`` are always structural: remove the argument
#   (arch_check check 19). A guard is not an option — see commit a5d34c0d, where
#   two correct ones left the finding standing.
#
# READ THE FLOW BEFORE YOU FIX. This note used to assert that ``scripts/``
#   findings are "always structural", and cited
#   ``generate_regulatory_tables.py::TARGET_PATHS`` as the worked example. That
#   was wrong, and it cost two failed fixes (2b1be086 and its successor), each
#   designed from the rule name rather than from the reported source -> sink. The
#   generator's S2083 flow is TWO steps and names neither the mapping nor the
#   write path:
#     source: ``path.read_text(...)`` in ``_splice``  -> the file CONTENT
#     sink:   ``path.write_text(desired, ...)``       -> "malicious value used as argument"
#   The taint is the spliced content, not the path, so no amount of path
#   restructuring moves it — and the read/write asymmetry that looks like
#   evidence about provenance is just ``read_text`` taking no tainted argument.
#   ``_splice`` must read the target to preserve the hand-written prose outside
#   the GENERATED markers, and the script must write the result back, so the flow
#   IS the feature. Writing file-derived content to a compile-time-constant path
#   is not path injection; this one is accepted in the platform.
#   Retrieve any flow before designing a fix (works without SonarCloud access):
#     gh api "repos/OpenAfterHours/rwa_calculator/code-scanning/analyses?tool_name=SonarCloud&ref=refs/heads/master" --jq '.[0].id'
#     gh api "repos/.../code-scanning/analyses/<id>" -H "Accept: application/sarif+json"
#   then read ``.runs[].results[].codeFlows[].threadFlows[].locations[]``. For a
#   pull request use ``ref=refs/pull/<n>/head``.
#
#   THAT ROUTE SHOWS SECURITY FINDINGS ONLY, and the gate does not. SonarCloud
#   exports only its taint/security rules to GitHub code scanning, so a BUG or a
#   CODE_SMELL is invisible there — a SARIF ``results_count`` of 0 alongside a
#   red "SonarCloud Code Analysis" check means the gate failed on a RATING, not
#   on anything the route above can show you. (Measured on PR 478: six S5145
#   findings fixed, SARIF then reported 0 results, and the gate still failed on
#   "C Reliability Rating on New Code" — a single python:S1244 float-equality
#   bug that the SARIF route never mentioned.) Read the check's own summary for
#   the failed CONDITION, then retrieve the issues themselves — the SonarCloud
#   web API answers anonymously for this project, no token needed:
#     curl -s "https://sonarcloud.io/api/issues/search?componentKeys=OpenAfterHours_rwa_calculator&pullRequest=<n>&types=BUG"
#   Swap ``pullRequest=<n>`` for ``branch=master``, and ``types`` for
#   ``BUG,VULNERABILITY,CODE_SMELL`` to see everything.
# S5145 (log injection, CWE-117) — a SECOND taint class, and unlike S2083 this
#   one has a real structural fix, so do not reach for an accept. Six findings
#   landed with the return-reconciliation UI: the route's query parameters
#   (`template`, `sheet`, `group`, `money`, `row`, `col`) reached `logger`
#   calls in ui/views/return_recon.py and analysis/return_recon.py. The flow is
#   genuine — a value carrying a newline forges a log RECORD, and a reader or an
#   incident responder then believes a line the system never emitted.
#
#   TWO remedies, in this order of preference:
#   1. PROVENANCE. Where the value is matched against a collection this process
#      produced, return the element FROM that collection instead of the
#      request's string. `x if x in known else default` does NOT clear the
#      taint — it assigns the caller's object, having merely checked it. Use
#      `next((k for k in known if k == x), default)`, which yields an object
#      whose origin is ours. Behaviour is identical (the two compare equal);
#      only the provenance differs, and provenance is what the analyser — and a
#      reader — can actually verify.
#   2. NEUTRALISE at the log site with `observability.loggable` when there is no
#      such collection (a run id, an operator-supplied filename). It replaces
#      every non-printable character — the Cc/Cf/Zl/Zp categories are exactly
#      the ones that break or rewrite a line — and bounds the length.
#      Deliberately NOT done in a `logging.Formatter`: that would catch every
#      site at once but destroy the distinction between a value the author owns
#      and one a stranger supplied, at the only point where it is still visible.
#
#   The S2083 accept below does NOT generalise to S5145. That one is accepted
#   because the flow IS the feature; this one was a defect and is fixed.
#
# STATUS of the S2083 accept (checked 2026-08-29): NOT in effect. The master
#   analysis still carries it as the branch's only code-scanning result
#   (`pythonsecurity:S2083`, issue key AZ__l2AI-nu7-4qGDJNX) and the SonarCloud
#   Code Analysis check reports "Quality Gate failed". The flow is unchanged and
#   still matches the description above — source `_splice`'s `path.read_text` at
#   generate_regulatory_tables.py:821, sink `path.write_text` at :703. Analysis
#   is AUTOMATIC (there is no sonar step in .github/workflows/), so no
#   `sonar.issue.ignore` entry here can reach a `pythonsecurity:*` rule: the
#   accept has to be re-applied in the platform. Do not spend a third attempt on
#   a structural fix — two have already failed, and a splice that preserves
#   hand-written prose MUST read what it preserves.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S101
sonar.issue.ignore.multicriteria.e1.resourceKey=tests/**/*.py
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S125
sonar.issue.ignore.multicriteria.e2.resourceKey=tests/**/*.py
sonar.issue.ignore.multicriteria.e3.ruleKey=pythonbugs:S2259
sonar.issue.ignore.multicriteria.e3.resourceKey=tests/**/*.py
sonar.issue.ignore.multicriteria.e4.ruleKey=python:S1244
sonar.issue.ignore.multicriteria.e4.resourceKey=tests/**/*.py
sonar.issue.ignore.multicriteria.e5.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.e5.resourceKey=src/rwa_calc/ui/app/main.py
