# ===========================================================================
# C 08.01 / OF 08.01 — CR IRB 1, published once per IRB exposure class.
#
# The sheet population is "the exposures for which the risk weighted exposure
# amounts are calculated in accordance with Articles 151 to 157" (CRR Annex II
# ¶73), which INCLUDES the Art. 153(5) slotting approach — row 0080 is
# "SPECIALISED LENDING SLOTTING APPROACH: TOTAL". So every sheet's approach
# clause admits foundation_irb, advanced_irb and slotting, and it is the class
# clause that separates them; the slotting legs carry the specialised_lending
# class and so appear on that sheet alone.
#
# Columns (CRR / PS1/26 where renumbered):
#   c0020  ORIGINAL EXPOSURE PRE-CONVERSION FACTORS — "the exposure value before
#          taking into account any value adjustments, provisions, effects due to
#          credit risk mitigation techniques or credit conversion factors"
#          (CRR p.98, PS1/26 p.102). Gross, both sides, ORIGIN class.
#   c0110  EXPOSURE VALUE — Art. 166 / Art. 166A-166D. POST-substitution.
#   c0255  (CRR) RWEA pre supporting factors.
#   c0251  (B31) RISK-WEIGHTED EXPOSURE AMOUNT PRE-ADJUSTMENTS — "The adjustments
#          set out in Articles 153(5A) and 154(4A) shall not be taken into
#          account" (PS1/26 p.111).
#   c0260  RWEA after supporting factors (CRR) / after adjustments (B31, "the
#          value reported in column 0251 and adjust for values reported in
#          columns 0252 to 0254", p.112).
#   c0276  (B31) NON-MODELLED APPROACHES RISK-WEIGHTED EXPOSURE AMOUNT —
#          "Standardised approach equivalent risk-weighted exposure amount ...
#          for the purpose of institutions' compliance with the output floor"
#          (p.113). This is the SA-equivalent every leg carries, `sa_rwa`.
#   c0280  (CRR) EXPECTED LOSS AMOUNT / (B31) EL pre post-model adjustments.
#   c0282  (B31) EXPECTED LOSS AMOUNT AFTER POST-MODEL ADJUSTMENTS.
#
# Rows: 0010 TOTAL EXPOSURES; 0020 on-balance-sheet items; 0030 off-balance-sheet
#       items; 0070 exposures assigned to obligor grades or pools: total;
#       0080 specialised lending slotting approach: total (CRR pp. 105-107,
#       PS1/26 pp. 115-117).
# ===========================================================================

