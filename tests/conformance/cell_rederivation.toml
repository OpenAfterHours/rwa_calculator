#
# C4b — independent re-derivation of template MONEY cells.
#
# A second, separately-authored predicate and metric for each cell, taken from
# the published Annex II / Pillar 3 instruction text and held HERE rather than in
# `reporting/cellspec.py`. The duplication IS the control: `reporting/lineage.py`
# re-runs the generator's own predicate by design, so without this nothing in the
# estate gives a second opinion on whether a cell's predicate is the RIGHT
# predicate. A wrong CellSpec today produces a number that is self-consistent,
# lineage-explicable, golden-matching and rule-passing.
#
# Every cell below was authored from the instruction PDF listed in `meta.sources`
# — read with pymupdf, quoted into the cell's `note` — and NOT from the
# generator. Where the two disagree the cell carries a `known_difference` and the
# suite xfails it STRICTLY, so the liability is visible and a later fix forces the
# entry out rather than silently passing.
#
# ---------------------------------------------------------------------------
# Semantics
# ---------------------------------------------------------------------------
#
# Each [[cell]] names a template cell and states how to rebuild it from the
# SEALED aggregator-exit ledger:
#
#   template = "OV1" | "C0700" | "C0801" | "C0802" | "C0200"
#   member  = "<sheet key>"        the per-exposure-class sheet, where the
#                                  template is published once per class
#   metric  = "sum"                the only metric these cells need
#   carrier = "<ledger column>"    which column carries the money, or a LIST of
#                                  columns summed row-wise (see below)
#   scale   = <float>              applied after the sum (0.08 for own funds)
#   where   = [ {column, op, value|values}, ... ]   AND-ed clauses
#   ops     = in | not_in | equals | not_equals | not_starts_with
#           | is_true | is_false | eq_num | ge | lt
#
# The control is over the PREDICATE and the CARRIER, not over the upstream
# numbers: both sides read the same sealed ledger, so a difference can only come
# from disagreeing about which rows and which column a cell is made of.
#
# `basis` is MANDATORY and records, per cell, what this re-derivation does NOT
# independently settle. `rederive.py` refuses to load a cell without it.
#
# ---------------------------------------------------------------------------
# Vocabulary extensions, and why each was unavoidable
# ---------------------------------------------------------------------------
#
# The 2026-08-08 file had five string operators and a single carrier. Extending
# beyond UK OV1 needed four additions, each because a published axis is not
# expressible in the old vocabulary at all:
#
# 1. `member` — C 07.00, C 08.01 and C 08.02 are published ONCE PER EXPOSURE
#    CLASS ("The information in CR SA is required for the total exposure classes
#    and individually for each of the exposure classes", CRR Annex II ¶47), so a
#    cell address needs a sheet as well as a row and a column. This also makes
#    the SHEET axis part of the second opinion: the member clause here is an
#    independently authored statement about which class a sheet holds.
#
# 2. A LIST-valued `carrier` — "Original exposure pre-conversion factors" is
#    additive over the on- and off-balance-sheet sides (CRR Art. 111 for SA,
#    Art. 166 for IRB) and NO single sealed column holds it. Expressing it as one
#    carrier would have meant either picking a side or inventing a ledger column,
#    and inventing a column is how a second opinion stops being independent.
#
# 3. `is_true` / `is_false` — rows 0070/0080 of C 07.00 and 0020/0030 of C 08.01
#    partition by balance-sheet side, which is a Boolean ledger column. A null
#    satisfies NEITHER limb, deliberately: `reporting_on_balance_sheet` is null
#    exactly on the legs outside the on/off-balance-sheet credit-risk scope
#    (CCR, settlement), and Annex II puts those in rows 0090-0130 instead.
#
#    ATTRIBUTION, corrected 2026-08-09. That null rule is NOT this author's
#    reading of Annex II — it is quoted from `engine/aggregator/aggregator.py`
#    lines 834-838, which declares `reporting_on_balance_sheet` "null = excluded
#    from both on- and off-BS template cells", and lines 866-867, which put the
#    CCR / settlement legs outside the gross scope on both sides. The Annex II
#    rows say only what each row contains; they do not prescribe how a
#    three-valued column resolves. This file's most elaborate design
#    justification is therefore BORROWED from an engine docstring, and its
#    carrier-versus-clause companion (see `c0700-corporate-0070-0010`) is
#    borrowed from lines 849-851 of the same docstring. Both are also currently
#    INERT on this portfolio. Recorded rather than reworded because a reader
#    entitled to think the vocabulary was independently derived would be wrong.
#
# 4. `eq_num` / `ge` / `lt` — two published axes are NUMERIC INTERVALS, not
#    string categories: C 07.00 rows 0140-0280 are the "BREAKDOWN OF EXPOSURES BY
#    RISK WEIGHTS" and C 08.02's rows are PD bands. String equality cannot
#    express either. `eq_num` compares within 1e-9 because a risk weight is a
#    Float64 built from a decimal literal.
#
# No arithmetic between cells was added, and no operator can reference a
# generated value — a cell is still a filter, a carrier and a scale.
#

[meta]
authored = "2026-08-08"
extended = "2026-08-09"
# PAGE-NUMBER CONVENTION. Every "p.N" below is the PRINTED page of the source
# document — the number in its page header — which in both Annex II files is the
# PDF page index + 1. To re-read a citation:
#     import fitz; print(fitz.open(<path>)[N - 1].get_text())
# Nine citation families in the first draft of this file named the section-header
# page rather than the page carrying the row definition, each off by exactly one;
# all were re-checked against the PDFs on 2026-08-09 and corrected. If you add a
# cell, verify the page the same way rather than copying a neighbour's.
sources = [
  "UK Pillar 3 Annex II, Template UK OV1 (docs/assets/crr-pillar3-risk-weighted-exposure-instructions-leverage-ratio.pdf, pp. 1-2)",
  "CRR Annex II reporting instructions (docs/assets/crr-annex-ii-reporting-instructins.pdf): C 07.00 columns pp. 86-90, C 07.00 rows pp. 91-95, C 08.01 columns pp. 98-105, C 08.01 rows pp. 105-107, C 08.02 p. 108, C 02.00 rows pp. 28-34",
  "PS1/26 Annex II reporting instructions (docs/assets/ps1-26-annex-ii-reporting-instructions.pdf): OF 02.00 rows pp. 28-38 and columns p. 39, OF 07.00 columns pp. 81-87, OF 07.00 rows pp. 88-94, OF 08.01 columns pp. 102-115, OF 08.01 rows pp. 115-118",
  "CRR Art. 92(1)-(3), Art. 111, Art. 113, Art. 153(5), Art. 155(2), Art. 158, Art. 166, Art. 438(d), Art. 501/501a",
  "PRA PS1/26 Art. 92(2a)/(3a)/(5) (output floor), Art. 113, Art. 122A/122B, Art. 153(5A), Art. 154(4A), Art. 158(6A)",
  # NON-PUBLISHED sources, listed because they influenced the file and a reader
  # is entitled to know a second opinion drew on in-repo material:
  "src/rwa_calc/engine/aggregator/aggregator.py lines 830-960 — the aggregator-exit projection docstring. Read to learn what each sealed ledger carrier MEANS (you cannot choose a carrier without that). It also supplied the null-resolution rule behind operator #3 and the carrier-versus-clause split behind c0700-corporate-0070-0010, both attributed at their sites.",
  "src/rwa_calc/reporting/validations/rules/crr-eba-v3.0-credit-risk.json — the published EBA validation rules v0204_m / v0205_m / v0206_m / v0207_m / v0210_m / v0211_m, used as secondary authority for the C 02.00 row hierarchy.",
  "tests/expected_outputs/reporting/validation_known_breaks.json — read for the caution_on_plan_doc_definitions note on the C 07.00 col 0200/0220 substitution basis.",
  "src/rwa_calc/reporting/corep/c02.py module docstring — read AFTER the C 02.00 row-shift was derived, to check whether the implementation cited a different published source before it was reported as a defect. It did not. One phrase from it is quoted in test_output_floor_column_is_the_floor_amount, and its absent-tolerant equity rule is cited in the UK 4a xfail.",
]
limits = """
Things this file deliberately does NOT settle, stated so a green run is not
over-read:

1. PRE- vs POST-SUBSTITUTION BASIS. This is the largest remaining hole and it is
   the one the reporting estate has already been bitten by
   (tests/expected_outputs/reporting/validation_known_breaks.json,
   `caution_on_plan_doc_definitions`). Annex II ¶56/¶65 splits every SA and IRB
   sheet across two bases: the "Original exposure pre-conversion factors" column
   is cut on the ORIGIN exposure class, and the "Exposure value" / RWEA columns
   on the class AFTER substitution. Every cell below states which basis it takes
   (`reporting_class_origin` / `reporting_approach_origin` vs `reporting_class` /
   `reporting_approach`), but the generated portfolio carries NO guarantees, so
   origin and applied coincide on every leg and the choice is arithmetically
   untested. Settling it needs a portfolio with a boundary-crossing guarantee
   whose crossing RWEA is non-zero (.claude/LESSONS.md C2), which is a bigger
   adjudication job than adding the cells: every basis-cut cell on both sheets
   would move at once.

2. CCR EXCLUSION AND CCR ROWS. Row 1 of OV1 expresses its "excluding CCR" cut as
   "not a synthetic CCR leg"; C 07.00 rows 0090-0130 and C 08.01 rows 0040-0060
   are the CCR breakdowns. The portfolio has no derivatives and no SFTs, so none
   of that is exercised.

3. SUPPORTING FACTORS. CRR C 07.00 c0215 vs c0220 and C 08.01 c0255 vs c0260 are
   the pre- and post-Art. 501/501a pair. No obligor in the portfolio is an SME or
   an infrastructure entity, so `supporting_factor` is 1.0 everywhere and the two
   cells of each pair are numerically identical. Their carriers differ, so a
   defect that populated one and not the other WOULD be caught; a defect in the
   supporting-factor arithmetic itself would not.

4. THE PORTFOLIO OUTPUT FLOOR. `rwa_pre_floor` and `rwa_final` are equal on this
   portfolio (the floor does not bind), so every cell that had to choose between
   them is untested on that choice. `test_output_floor_column_is_the_floor_amount`
   attacks the floor column directly instead.

5. POST-MODEL ADJUSTMENTS. B31 C 08.01 c0280 (EL pre post-model adjustments) and
   c0282 (EL after) are separate published columns; no leg here carries a PMA, so
   only c0282 is authored and the pair's distinction is not settled.

6. NON-MONEY CELLS. Exposure-weighted averages (PD, LGD, maturity) and counts
   (number of obligors) are out of scope by construction — `metric` is "sum".
   C 08.01 c0010/c0230/c0250/c0300 are therefore unasserted here.

7. TEMPLATE COVERAGE. Four of the nineteen template modules are covered
   (pillar3/ov1, corep/c07, corep/c08 for C 08.01 and C 08.02, corep/c02 for
   C 02.00 / OF 02.00). C 08.03/04/05/06/07, C 09.01/02, C 34.*, OF 02.01 and the
   Pillar 3 CR4/CR5/CR6/CR7/CR8/CR9/CR10/CMS1/CMS2 templates have no second
   opinion.
"""

# ===========================================================================
# UK OV1 — Overview of risk-weighted exposure amounts (Art. 438(d))
#
# Column a: "Risk weighted exposure amounts (RWEAs) — Risk-weighted exposure
#           amount calculated in accordance with Articles 92(3), 95, 96 and 98
#           CRR." So the carrier is the FINAL, post-floor RWEA the own funds
#           requirement is computed on — `rwa_final` — never `rwa_pre_floor`,
#           `sa_rwa` (the SA-equivalent every leg carries for the output floor)
#           or `rwa_pre_factor`.
# Column c: "Total own funds requirements — Own fund requirements corresponding
#           to the RWEAs for the different risk categories", i.e. Art. 92(1)'s
#           8% of the same RWEA. Any column-c cell that is not exactly 0.08x its
#           own column-a cell is a sign/scale defect.
# ===========================================================================

[[cell]]
id = "ov1-1-a"
template = "OV1"
row = "1"
column = "a"
regimes = ["CRR", "B31"]
metric = "sum"
carrier = "rwa_final"
scale = 1.0
where = [{ column = "exposure_reference", op = "not_starts_with", value = "ccr__" }]
citation = "UK OV1 row 1; CRR Art. 92(3), Chapters 1-4 of Title II of Part Three"
note = """
"Credit risk (excluding CCR). RWEAs ... calculated in accordance with Chapters 1
to 4 of Title II of Part Three CRR, and with Article 379 CRR. RWEAs for
securitisation exposures in the non-trading book and for CCR are excluded and
disclosed in rows 6 and 16 of this template."
"""
basis = "The CCR cut is inert (limits 2). What IS exercised is the carrier and the scale."

