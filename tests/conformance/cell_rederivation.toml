# ===========================================================================
# C 07.00 / OF 07.00 — CR SA, published once per SA exposure class.
#
# Columns, verbatim from the instruction text:
#
# c0010 "ORIGINAL EXPOSURE PRE-CONVERSION FACTORS. Exposure value calculated in
#       accordance with Article 111 CRR without taking into account value
#       adjustments and provisions, deductions, conversion factors and the effect
#       of credit risk mitigation techniques" (CRR Annex II p.86; PS1/26 p.81 is
#       word-for-word bar the Rulebook Part names). So: GROSS, both balance-sheet
#       sides, ORIGIN class — ¶56(a) "the Original exposure pre-conversion
#       factors shall be classified into the corresponding (original) exposure
#       class ... In a second step the exposures may be redistributed".
#
# c0200 "Exposure value ... after taking into account value adjustments, all
#       credit risk mitigants and credit conversion factors that is to be
#       assigned to risk weights" (CRR p.89; PS1/26 p.85). POST-substitution.
#
# c0215 "Risk weighted exposure amount pre supporting factors ... without taking
#       into account the SME and infrastructure supporting factors laid down in
#       Article 501 and Article 501a CRR" (CRR p.90). CRR only.
#
# c0220 CRR: "Risk weighted exposure amount after supporting factors ... taking
#       into account the SME and infrastructure supporting factors" (p.90).
#       PS1/26: "Risk-weighted exposure amount. Paragraphs 1 to 5 of Article 113"
#       (p.86) — Basel 3.1 deleted both supporting factors, so the one column is
#       the post-factor figure in both regimes and `rwa_post_factor` is its
#       carrier under each.
#
# Rows: 0010 "Total exposures"; 0070 "On balance sheet exposures subject to
#       credit risk"; 0080 "Off balance sheet exposures subject to credit risk";
#       0140-0280 "BREAKDOWN OF EXPOSURES BY RISK WEIGHTS" with 0140 = 0%,
#       0180 = 20%, 0200 = 50%, 0220 = 75%, 0230 = 100%. CRR rows: r0010 on p.91,
#       r0070/r0080 on p.92, the risk-weight rows on p.93.
# ===========================================================================

