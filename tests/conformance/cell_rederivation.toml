# ===========================================================================
# C 02.00 / OF 02.00 — own funds requirements (CA2), the footing template.
#
# Every row of this template is a RISK EXPOSURE AMOUNT, not an own funds figure:
# row 0010 is "TOTAL RISK EXPOSURE AMOUNT" (Art. 92(3)), and the EBA validation
# rule shipped in this repo makes the hierarchy explicit —
#   v0204_m: {r0010} = {r0040} + {r0490} + {r0520} + {r0590} + {r0630} + {r0640}
#            + {r0680} + {r0690}
#   v0205_m: {r0040} = {r0050} + {r0240} + {r0460} + {r0470}
#   v0207_m: {r0060} = {r0070} + ... + {r0211}
#   v0210_m: {r0250} = {r0260} + {r0270} + {r0280} + {r0290} + {r0300}
#   v0211_m: {r0310} = {r0320} + ... + {r0410}
# so r0040 is the credit-risk RWEA, r0050 the standardised total, r0240 the IRB
# total, r0250 the F-IRB total and r0310 the A-IRB total. PS1/26 keeps all five
# numbers and re-labels the children (OF 02.00 rows, pp. 28-32).
#
# The single CRR column and B31 column 0010 are "All approaches"; B31 c0020 is
# "Standardised approaches only (output floor)" — "Rows containing totals by risk
# type should reflect entire current portfolios using standardised approaches
# only" (PS1/26 Annex II p.39).
# ===========================================================================

[[cell]]
id = "c0200-0010-0010"
template = "C0200"
row = "0010"
column = "0010"
regimes = ["CRR", "B31"]
metric = "sum"
carrier = "rwa_final"
scale = 1.0
where = []
citation = "CRR Annex II C 02.00 r0010 (p.28) / PS1/26 OF 02.00 r0010 (p.28); CRR Art. 92(3)"
basis = """
The whole-ledger total. Equal to OV1 row 29 by arithmetic — the two are authored
against different instruction documents, so their agreement is a cross-template
measurement rather than a restatement.
"""

[[cell]]
id = "c0200-0040-0010"
template = "C0200"
row = "0040"
column = "0010"
regimes = ["CRR", "B31"]
metric = "sum"
carrier = "rwa_final"
scale = 1.0
where = []
citation = "CRR Annex II C 02.00 r0040 (p.28) / PS1/26 OF 02.00 r0040 (p.29); CRR Art. 92(3)(a),(f)"
note = """
"1.1 RISK WEIGHTED EXPOSURE AMOUNTS FOR CREDIT, COUNTERPARTY CREDIT AND DILUTION
RISKS AND FREE DELIVERIES. Points (a) and (f) of Article 92(3) CRR." An RWEA row,
and v0204_m sums it into r0010 alongside the other risk types — an own funds
figure in this row would make r0010 = r0040 impossible on a credit-only book.
"""
basis = """
Equals r0010 on a credit-risk-only book, so this cell does not settle the
credit/market/operational split. It DOES settle whether the row carries an RWEA
or an own funds requirement, which is the 12.5x question.
"""
known_difference = """
The engine labels this row "TOTAL OWN FUNDS REQUIREMENTS" and publishes 8% of the
TREA in it: 2,407,878.18 (CRR) / 2,036,887.99 (B31) against a re-derived
30,098,477.21 / 25,461,099.93. The engine is believed WRONG. Every row of C 02.00
is a risk exposure amount — r0010 is "TOTAL RISK EXPOSURE AMOUNT", and the EBA
rule v0204_m shipped in this repo sums r0040 into r0010 with the other risk
types, which is arithmetically impossible if r0040 is one-twelve-and-a-halfth of
its own parent. Own funds requirements are C 03.00's subject, not CA2's. Direction
of the error: the credit-risk RWEA line of the return understates by
27,690,599.04 (CRR) / 23,424,211.93 (B31). Logged rather than fixed: the operator
instruction for this run is that new defects are registered now and actioned in a
later run.
"""

