# ===========================================================================
# C 08.02 / OF 08.02 — CR IRB 2, the same columns broken down by obligor grade.
#
# "Instructions for each of these columns are the same as for the corresponding
# numbered columns in CR IRB 1 template" (CRR Annex II p.107), and the rows are
# "filled in in the order corresponding to the PD assigned to the obligor grade
# or pool". The rows are therefore a NUMERIC PARTITION of the sheet's population
# by regulatory PD, and unlike C 08.03/CR9 the grades do not nest — so summing
# the rows is legitimate and the row addresses are intervals.
#
# The PD is the one used in the calculation, i.e. AFTER the Art. 160(1)/163(1)
# input floors: PS1/26 c0280 requires the reported figures to be "based on the
# risk parameters approved by the PRA following the application of any applicable
# PD and LGD input floors". Carrier for the axis: `pd_floored`.
# ===========================================================================

[[cell]]
id = "c0802-corporate-pd025-0110"
template = "C0802"
member = "corporate"
row = "0.25% - 0.50%"
column = "0110"
regimes = ["CRR", "B31"]
metric = "sum"
carrier = "reporting_ead"
scale = 1.0
where = [
  { column = "reporting_approach", op = "in", values = ["foundation_irb", "advanced_irb"] },
  { column = "reporting_class", op = "equals", value = "corporate" },
  { column = "pd_floored", op = "ge", value = "0.0025" },
  { column = "pd_floored", op = "lt", value = "0.005" },
]
citation = "CRR Annex II C 08.02 rows/columns (p.108) referring to C 08.01 c0110 (p.100); CRR Art. 180"
basis = """
Two bands are populated on this sheet, so the band boundary is load-bearing: a
cell that took the whole class would break here. Slotting is excluded because
C 08.02 is a grade breakdown and a slotting leg has no obligor grade.

WEAKEST CELL IN THE FILE ON THE INDEPENDENCE AXIS, corrected 2026-08-09. This
basis used to say "the boundaries are the published COREP scale". They are NOT
published anywhere. C 08.01 r0070 (p.107) is explicit in the other direction: "A
supervisory master scale is not used. Instead, institutions shall determine the
scale to be used themselves." C 08.02's published row axis is the institution's OWN
grades in ascending PD order, so ANY banding of them is a reporting choice, and the
0.25/0.50/0.75/2.50 boundaries used here are the engine's own
`reporting/corep/templates.py::PD_BANDS` constant, as is the label string. That
makes the whole ROW AXIS of these two cells engine-derived rather than
independently sourced — a second copy, not a second opinion, on that axis.
(.claude/LESSONS.md E4 says the same thing from the other side: band labels live
only in the template workbook, not the instruction PDFs.)

They still earn their place, on a narrower claim: given the engine's own band
edges, these cells independently assert WHICH LEGS fall in each band and WHICH
CARRIER the cell sums, so a band swap, a carrier swap or a widened interval is
detected — that was demonstrated by mutation (widening this band to 0.025 produced
a 8,750,000.00 delta). What they cannot detect is a wrong band edge, because both
sides would move together.
"""

