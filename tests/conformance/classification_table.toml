#
# C4a — classification conformance decision table.
#
# Authored from the article text of the UK CRR (docs/assets/crr.pdf) and PRA
# PS1/26 Appendix 1 (docs/assets/ps126app1.pdf), read verbatim. It is NOT
# derived from the classifier, and it must never be edited to make a failing
# assertion pass — a disagreement is the product.
#
# ---------------------------------------------------------------------------
# Semantics
# ---------------------------------------------------------------------------
#
# Four independent rule lists, one per output field:
#
#   sa_class_rule    -> exposure_class_sa   (CRR Art. 112 / PS1/26 SA classes)
#   irb_class_rule   -> exposure_class_irb  (CRR Art. 147(2) / PS1/26 Art. 147(2))
#   class_rule       -> exposure_class      (the carrier the calculators and the
#                                            reporting projection read)
#   approach_rule    -> approach            (CRR Art. 143/151/153, PS1/26 Art. 147A(1))
#
# Each list is evaluated top-down, FIRST MATCH WINS. A rule's `when` table
# constrains dimensions; an absent dimension is a wildcard and a list value is
# a membership test. A generated combination that matches NO rule is a hard
# failure, not a skip and not a default.
#
# Dimensions: regime, entity_type, size_band, irb_inputs, flavour.
#
# `sourcing` records how far the verdict is carried by the article text:
#   "regulation" - stated by the cited article.
#   "convention" - the article is silent; the value records a deliberate engine
#                  convention. A mismatch here is an INCONSISTENCY finding, not
#                  a regulatory breach. `note` is mandatory.
#   "scope"      - the article speaks, but about a decision another pipeline
#                  stage makes; the verdict states what classification leaves
#                  behind. `note` is mandatory.
# `verdict = "unsourced"` means the field is deliberately NOT asserted for that
# combination; `note` is mandatory and the count is reported.
#

[meta]
authored = "2026-08-08"
sources = [
  "UK CRR (EU 575/2013 as onshored) Art. 112, 113(5), 117, 118, 119(5), 123, 128 (omitted), 147, 151, 153",
  "PRA PS1/26 Appendix 1 Art. 128, 147(2)-(8), 147A(1), 147B",
]
verdict_scope = """
Stated at the CLASSIFIER STAGE EXIT, not at the end of the pipeline. Downstream
stages legitimately re-key the class: the SA real-estate splitter emits the
Art. 112(1)(i) residential/commercial classes, CRM substitution re-homes the
covered leg, and the aggregator derives `exposure_class_applied` (which is where
the Art. 112(1)(j) `defaulted` class is assigned). None of those are in scope
here.
"""

# ===========================================================================
# Exclusions — input combinations the space generates but the regulation does
# not admit, so no verdict is authored for them.
# ===========================================================================

[[exclusion]]
id = "X1-sl-non-corporate"
when = { entity_type = ["individual", "institution", "sovereign"], flavour = "slotting" }
reason = """
Specialised lending is a sub-population OF the corporate exposure class: CRR
Art. 147(8) identifies it "within the corporate exposure class laid down in
point (c) of paragraph 2", and PS1/26 Art. 147(4B) opens "Exposures to
corporates shall be assigned to the specialised lending exposure subclass".
Art. 147(4B)(a) further requires the obligor to be "an entity which was created
specifically to finance and/or operate physical assets", which a natural
person, a credit institution and a central government are not. A specialised-
lending record against those obligors is an inadmissible input.
"""
citation = "CRR Art. 147(8); PS1/26 Art. 147(4B)(a)"

[[exclusion]]
id = "X2-mortgage-non-retail"
when = { entity_type = ["institution", "sovereign", "specialised_lending"], flavour = "mortgage" }
reason = """
CRR Art. 112(1)(i) defines a class by the SECURITY ("exposures secured by
mortgages on immovable property"), not by the obligor, and the engine assigns
it downstream in the SA real-estate splitter (CRR Art. 125/126, PS1/26
Art. 124F/124H), not in the classifier. For a non-retail obligor the article
text therefore does not determine the CLASSIFIER-EXIT verdict, and authoring one
would be a guess about stage boundaries rather than about regulation.
"""
citation = "CRR Art. 112(1)(i), Art. 125, Art. 126; PS1/26 Art. 124F, Art. 124H"

# ===========================================================================
# exposure_class_sa — CRR Art. 112 / PS1/26 SA exposure classes
# ===========================================================================

[[sa_class_rule]]
id = "SA0-specialised-lending"
when = { flavour = "slotting" }
verdict = "corporate"
sourcing = "regulation"
citation = "CRR Art. 112(1)(g); PS1/26 Art. 147(4B)"
note = """
Art. 112 lists no specialised-lending class. A specialised-lending exposure is
an exposure to a corporate under the Standardised Approach; the separate
identification is an IRB device (Art. 147(8)).
"""

[[sa_class_rule]]
id = "SA1-central-government"
when = { entity_type = ["sovereign", "central_bank", "central_bank_ecb"] }
verdict = "central_govt_central_bank"
sourcing = "regulation"
citation = "CRR Art. 112(1)(a)"

[[sa_class_rule]]
id = "SA2-rgla"
when = { entity_type = ["rgla_sovereign", "rgla_institution"] }
verdict = "rgla"
sourcing = "regulation"
citation = "CRR Art. 112(1)(b)"

[[sa_class_rule]]
id = "SA3-pse"
when = { entity_type = ["pse_sovereign", "pse_institution"] }
verdict = "pse"
sourcing = "regulation"
citation = "CRR Art. 112(1)(c)"

[[sa_class_rule]]
id = "SA4-mdb"
when = { entity_type = ["mdb", "mdb_named"] }
verdict = "mdb"
sourcing = "regulation"
citation = "CRR Art. 112(1)(d), Art. 117"

[[sa_class_rule]]
id = "SA5-international-organisation"
when = { entity_type = "international_org" }
verdict = "international_organisation"
sourcing = "regulation"
citation = "CRR Art. 112(1)(e), Art. 118"

[[sa_class_rule]]
id = "SA6-ccp"
when = { entity_type = "ccp" }
verdict = "institution"
sourcing = "scope"
citation = "CRR Art. 112(1)(f); CRR Art. 300-311 (Chapter 6, Section 9)"
note = """
Art. 112 has no central-counterparty class. Exposures to CCPs are governed by
their own Chapter (Art. 300-311), which supplies the 2%/4% trade-exposure risk
weight rather than a class. Parking a CCP in the institutions class is the
engine's carrier choice; the treatment is decided elsewhere.
"""

[[sa_class_rule]]
id = "SA7-institution"
when = { entity_type = ["institution", "bank", "financial_institution"] }
verdict = "institution"
sourcing = "regulation"
citation = "CRR Art. 112(1)(f); CRR Art. 119(5) (financial institutions treated as institutions)"

[[sa_class_rule]]
id = "SA8-corporate"
when = { entity_type = ["corporate", "company", "specialised_lending"] }
verdict = "corporate"
sourcing = "regulation"
citation = "CRR Art. 112(1)(g)"

[[sa_class_rule]]
id = "SA9-retail"
when = { entity_type = ["individual", "retail", "natural_person"] }
verdict = "retail_other"
sourcing = "regulation"
citation = "CRR Art. 112(1)(h), Art. 123(a)"

[[sa_class_rule]]
id = "SA10-covered-bond"
when = { entity_type = "covered_bond" }
verdict = "covered_bond"
sourcing = "regulation"
citation = "CRR Art. 112(1)(l), Art. 129; PS1/26 Art. 129"

[[sa_class_rule]]
id = "SA11-equity"
when = { entity_type = "equity" }
verdict = "equity"
sourcing = "regulation"
citation = "CRR Art. 112(1)(p)"

[[sa_class_rule]]
id = "SA12-high-risk-crr"
when = { regime = "CRR", entity_type = ["high_risk", "high_risk_venture_capital", "high_risk_private_equity", "high_risk_speculative_re"] }
verdict = "other"
sourcing = "convention"
citation = "CRR Art. 128 (omitted 1.1.2022 by S.I. 2021/1078 reg. 6(3)(a)); CRR Art. 112(1)(q), Art. 113(5)"
note = """
Art. 128 — the only article that ever assigned a treatment to the Art. 112(1)(k)
high-risk class — was omitted from the onshored CRR with effect from 1 January
2022 (verbatim in crr.pdf: "F294 Art. 128 omitted (1.1.2022) by virtue of The
Capital Requirements Regulation (Amendment) Regulations 2021 (S.I. 2021/1078),
regs. 1(1), 6(3)(a)"). Art. 112(1)(k) itself SURVIVES in the enumeration, so
this is a convention, not a reading of the text: with no treatment article the
exposures fall to Art. 112(1)(q) other items, which Art. 113(5) also risk-weights
at 100%. The RW is identical either way; only the reported class label differs.
"""

[[sa_class_rule]]
id = "SA13-high-risk-b31"
when = { regime = "B31", entity_type = ["high_risk", "high_risk_venture_capital", "high_risk_private_equity", "high_risk_speculative_re"] }
verdict = "high_risk"
sourcing = "regulation"
citation = "PS1/26 Art. 128(1)"

[[sa_class_rule]]
id = "SA14-other-items"
when = { entity_type = ["other_cash", "other_gold", "other_items_in_collection", "other_tangible", "other_residual_lease"] }
verdict = "other"
sourcing = "regulation"
citation = "CRR Art. 112(1)(q), Art. 134"

# ===========================================================================
# exposure_class_irb — CRR Art. 147(2)-(8) / PS1/26 Art. 147(2)-(5C)
# ===========================================================================

[[irb_class_rule]]
id = "IRB0-specialised-lending"
when = { flavour = "slotting" }
verdict = "specialised_lending"
sourcing = "regulation"
citation = "CRR Art. 147(8); PS1/26 Art. 147(2)(c)(i), Art. 147(4B)"

[[irb_class_rule]]
id = "IRB1-retail-residential"
when = { entity_type = ["individual", "retail", "natural_person"], flavour = "mortgage" }
verdict = "retail_mortgage"
sourcing = "regulation"
citation = "CRR Art. 147(2)(d), Art. 154(3); PS1/26 Art. 147(5B)"

[[irb_class_rule]]
id = "IRB2-qrre"
when = { entity_type = ["individual", "retail", "natural_person"], flavour = ["revolving_qrre", "revolving_qrre_headroom"] }
verdict = "retail_qrre"
sourcing = "regulation"
citation = "CRR Art. 154(4); PS1/26 Art. 147(5A)(a)-(c)"
note = """
All three per-exposure conditions hold on both flavours: (a) the obligor is a
natural person; (b) the facility is revolving, unsecured, and its undrawn part
is unconditionally cancellable (risk_type "LR"); (c) the largest AGGREGATE
nominal exposure to the individual is one facility of GBP 70,000, inside both
the EUR 100,000 (CRR) and GBP 90,000 (PS1/26) caps. Conditions (5A)(d) and
(5A)(e) are portfolio-level supervisory attestations and are not per-exposure
inputs. The two flavours differ only in how the SAME facility is split into
legs, which Art. 147(5A)(c) does not make relevant — it measures the aggregate
nominal exposure to the individual, not a per-leg figure.
"""

[[irb_class_rule]]
id = "IRB3-corporate-sme"
when = { entity_type = ["corporate", "company", "specialised_lending"], size_band = "sme" }
verdict = "corporate_sme"
sourcing = "convention"
citation = "CRR Art. 4(1)(128D), Art. 153(4); PS1/26 Art. 147A(1)(f)"
note = """
Art. 147(2)(c) has ONE corporates class; there is no SME corporate class in
either framework's Art. 147(2) enumeration. `corporate_sme` is the engine's
representation of the Art. 153(4) SME correlation sub-population and of the
PS1/26 Art. 147A(1)(f) SME split that COREP discloses as separate rows. Recorded
as a convention so a change of representation is visible, not as a regulatory
verdict.
"""

[[irb_class_rule]]
id = "IRB4-central-government"
when = { entity_type = ["sovereign", "central_bank", "central_bank_ecb"] }
verdict = "central_govt_central_bank"
sourcing = "regulation"
citation = "CRR Art. 147(2)(a); PS1/26 Art. 147(3)(a)-(b)"

[[irb_class_rule]]
id = "IRB5-quasi-sovereign-sovereign-treated"
when = { entity_type = ["rgla_sovereign", "pse_sovereign"] }
verdict = "central_govt_central_bank"
sourcing = "regulation"
citation = "CRR Art. 147(3)(a); PS1/26 Art. 147(3)(c)-(e)"

[[irb_class_rule]]
id = "IRB6-quasi-sovereign-b31"
when = { regime = "B31", entity_type = ["rgla_institution", "pse_institution", "mdb", "mdb_named", "international_org"] }
verdict = "central_govt_central_bank"
sourcing = "regulation"
citation = "PS1/26 Art. 147(3)(c), (d), (e), (f), (g)"
note = """
PS1/26 Art. 147(3) assigns regional governments (c), local authorities (d),
public sector entities (e) and multilateral development banks (f) to the
Art. 147(2)(a) class UNCONDITIONALLY — the "0% risk weight" qualifier binds only
the (g) international-organisations limb, which these generated obligors also
satisfy (Art. 118 names them). The CRR-era "treated as institutions" routing of
Art. 147(4)(a)-(c) has no PS1/26 counterpart: PS1/26 Art. 147(4) admits only
institutions and Art. 119(5) financial institutions.
"""

[[irb_class_rule]]
id = "IRB7-quasi-sovereign-institution-treated-crr"
when = { regime = "CRR", entity_type = ["rgla_institution", "pse_institution", "mdb"] }
verdict = "institution"
sourcing = "regulation"
citation = "CRR Art. 147(4)(a), (b), (c)"

[[irb_class_rule]]
id = "IRB8-named-mdb-crr"
when = { regime = "CRR", entity_type = "mdb_named" }
verdict = "central_govt_central_bank"
sourcing = "regulation"
citation = "CRR Art. 147(3)(b), Art. 117(2)"

[[irb_class_rule]]
id = "IRB9-international-organisation-crr"
when = { regime = "CRR", entity_type = "international_org" }
verdict = "central_govt_central_bank"
sourcing = "regulation"
citation = "CRR Art. 147(3)(c), Art. 118"

[[irb_class_rule]]
id = "IRB10-institution"
when = { entity_type = ["institution", "bank", "financial_institution", "ccp"] }
verdict = "institution"
sourcing = "regulation"
citation = "CRR Art. 147(2)(b), Art. 147(4)(d); PS1/26 Art. 147(4)(a)-(b)"

[[irb_class_rule]]
id = "IRB11-corporate"
when = { entity_type = ["corporate", "company", "specialised_lending"] }
verdict = "corporate"
sourcing = "regulation"
citation = "CRR Art. 147(2)(c); PS1/26 Art. 147(2)(c), Art. 147(4D)"

[[irb_class_rule]]
id = "IRB12-retail-other"
when = { entity_type = ["individual", "retail", "natural_person"] }
verdict = "retail_other"
sourcing = "regulation"
citation = "CRR Art. 147(2)(d), Art. 147(5)(a)(i); PS1/26 Art. 147(5C)"

[[irb_class_rule]]
id = "IRB13-equity"
when = { entity_type = "equity" }
verdict = "equity"
sourcing = "regulation"
citation = "CRR Art. 147(2)(e), Art. 147(6); PS1/26 Art. 147(6)(a)"

[[irb_class_rule]]
id = "IRB14-other-non-credit-obligation"
when = { entity_type = ["other_cash", "other_gold", "other_items_in_collection", "other_tangible", "other_residual_lease"] }
verdict = "other"
sourcing = "regulation"
citation = "CRR Art. 147(2)(g), Art. 147(9); PS1/26 Art. 147(2)(g), Art. 147(8)"

[[irb_class_rule]]
id = "IRB15-covered-bond-residual"
when = { entity_type = "covered_bond" }
verdict = "corporate"
sourcing = "regulation"
citation = "CRR Art. 147(7); PS1/26 Art. 147(4A)"
note = """
Neither Art. 147(2) enumeration contains a covered-bond class. A covered bond
issued by a credit institution is an exposure to that institution and belongs in
Art. 147(2)(b); where the issuer is not an institution the residual limb applies
— CRR Art. 147(7) / PS1/26 Art. 147(4A): "Any credit obligation not assigned to
[points (a), (b), (d), (e), (ea) and (f)] shall be assigned to the corporate
exposure class". The `covered_bond` entity type names the instrument, not the
obligor, so the residual limb is the verdict authored here. What is NOT
contestable, and is what the codomain test asserts separately, is that
`covered_bond` is not an Art. 147(2) class at all.
"""

[[irb_class_rule]]
id = "IRB16-high-risk-residual"
when = { entity_type = ["high_risk", "high_risk_venture_capital", "high_risk_private_equity", "high_risk_speculative_re"] }
verdict = "corporate"
sourcing = "regulation"
citation = "CRR Art. 147(7); PS1/26 Art. 147(4A); PS1/26 Art. 128"
note = """
"Particularly high risk" is a Standardised-Approach concept only: it appears in
CRR Art. 112(1)(k)/128 and PS1/26 Art. 128, and in neither Art. 147(2)
enumeration. A high-risk credit obligation is still a credit obligation, so
Art. 147(2)(g) ("other NON-CREDIT-OBLIGATION assets") does not fit it and the
residual corporate limb applies.
"""

# ===========================================================================
# exposure_class — the routing carrier the calculators and the reporting
# projection read.
# ===========================================================================

[[class_rule]]
id = "C0-irb-probe-consequential"
when = { entity_type = ["mdb_named", "international_org", "covered_bond"], irb_inputs = ["pd", "pd_lgd"] }
verdict = "unsourced"
sourcing = "scope"
note = """
For these obligors the routing carrier's value is a CONSEQUENCE of the approach
verdict (the engine re-aligns it to the IRB class only on an IRB-routed row),
and the approach verdict for exactly these combinations is itself contested by
this table. Asserting the carrier here would report the same disagreement twice
and would have to be rewritten the moment the approach one is settled.
"""
citation = "CRR Art. 147(3)(b)-(c); PS1/26 Art. 147(3)(f)-(g)"

[[class_rule]]
id = "C1-specialised-lending"
when = { flavour = "slotting" }
verdict = "specialised_lending"
sourcing = "regulation"
citation = "CRR Art. 147(8), Art. 153(5); PS1/26 Art. 147(2)(c)(i), Art. 147A(1)(c)-(d)"

[[class_rule]]
id = "C2-retail-residential"
when = { entity_type = ["individual", "retail", "natural_person"], flavour = "mortgage" }
verdict = "retail_mortgage"
sourcing = "regulation"
citation = "CRR Art. 112(1)(i), Art. 154(3); PS1/26 Art. 147(5B)"

[[class_rule]]
id = "C3-qrre"
when = { entity_type = ["individual", "retail", "natural_person"], flavour = ["revolving_qrre", "revolving_qrre_headroom"] }
verdict = "retail_qrre"
sourcing = "regulation"
citation = "CRR Art. 154(4); PS1/26 Art. 147(5A)(a)-(c)"

[[class_rule]]
id = "C4-corporate-sme"
when = { entity_type = ["corporate", "company", "specialised_lending"], size_band = "sme" }
verdict = "corporate_sme"
sourcing = "convention"
citation = "CRR Art. 4(1)(128D), Art. 153(4); PS1/26 Art. 147A(1)(f)"
note = "See IRB3 — the same SME representation convention, on the routing carrier."

[[class_rule]]
id = "C5-central-government"
when = { entity_type = ["sovereign", "central_bank", "central_bank_ecb"] }
verdict = "central_govt_central_bank"
sourcing = "regulation"
citation = "CRR Art. 112(1)(a), Art. 147(2)(a); PS1/26 Art. 147(3)(a)-(b)"

[[class_rule]]
id = "C6-rgla"
when = { entity_type = ["rgla_sovereign", "rgla_institution"] }
verdict = "rgla"
sourcing = "scope"
citation = "CRR Art. 112(1)(b)"
note = """
Every generated RGLA combination routes standardised (none carries an internal
rating), so the carrier holds the Art. 112(1)(b) SA class. The engine re-aligns
the carrier to the Art. 147(3)/(4) IRB class only on an IRB-routed row; that
path is out of this space.
"""

[[class_rule]]
id = "C7-pse"
when = { entity_type = ["pse_sovereign", "pse_institution"] }
verdict = "pse"
sourcing = "scope"
citation = "CRR Art. 112(1)(c)"
note = "See C6 — SA-routed in this space, so the carrier holds the Art. 112(1)(c) class."

[[class_rule]]
id = "C8-mdb"
when = { entity_type = ["mdb", "mdb_named"] }
verdict = "mdb"
sourcing = "scope"
citation = "CRR Art. 112(1)(d), Art. 117"
note = "See C6 — SA-routed at the baseline, so the carrier holds the Art. 112(1)(d) class."

[[class_rule]]
id = "C9-international-organisation"
when = { entity_type = "international_org" }
verdict = "international_organisation"
sourcing = "scope"
citation = "CRR Art. 112(1)(e), Art. 118"
note = "See C6 — SA-routed at the baseline, so the carrier holds the Art. 112(1)(e) class."

[[class_rule]]
id = "C10-institution"
when = { entity_type = ["institution", "bank", "financial_institution", "ccp"] }
verdict = "institution"
sourcing = "regulation"
citation = "CRR Art. 112(1)(f), Art. 147(2)(b); PS1/26 Art. 147(4)(a)-(b)"

[[class_rule]]
id = "C11-corporate"
when = { entity_type = ["corporate", "company", "specialised_lending"] }
verdict = "corporate"
sourcing = "regulation"
citation = "CRR Art. 112(1)(g), Art. 147(2)(c); PS1/26 Art. 147(4D)"

[[class_rule]]
id = "C12-retail-other"
when = { entity_type = ["individual", "retail", "natural_person"] }
verdict = "retail_other"
sourcing = "regulation"
citation = "CRR Art. 112(1)(h), Art. 123; CRR Art. 147(2)(d); PS1/26 Art. 147(5C)"
note = """
The generated drawn amount (GBP 500,000) is inside the Art. 123(c) EUR 1,000,000
and PS1/26 Art. 147(5)(a)(ii) GBP 880,000 caps under both regimes, so the retail
class holds whatever the size band says: neither framework's retail test is a
turnover test for a natural person.
"""

[[class_rule]]
id = "C13-covered-bond"
when = { entity_type = "covered_bond" }
verdict = "covered_bond"
sourcing = "scope"
citation = "CRR Art. 112(1)(l), Art. 129; PS1/26 Art. 129"
note = "SA-routed at the baseline, so the carrier holds the Art. 112(1)(l) class."

[[class_rule]]
id = "C14-equity"
when = { entity_type = "equity" }
verdict = "equity"
sourcing = "regulation"
citation = "CRR Art. 112(1)(p), Art. 147(2)(e); PS1/26 Art. 147(6)(a)"

[[class_rule]]
id = "C15-high-risk-crr"
when = { regime = "CRR", entity_type = ["high_risk", "high_risk_venture_capital", "high_risk_private_equity", "high_risk_speculative_re"] }
verdict = "other"
sourcing = "convention"
citation = "CRR Art. 128 (omitted by S.I. 2021/1078 reg. 6(3)(a)); Art. 112(1)(q), Art. 113(5)"
note = "See SA12 — the same omitted-article convention, on the routing carrier."

[[class_rule]]
id = "C16-high-risk-b31"
when = { regime = "B31", entity_type = ["high_risk", "high_risk_venture_capital", "high_risk_private_equity", "high_risk_speculative_re"] }
verdict = "high_risk"
sourcing = "regulation"
citation = "PS1/26 Art. 128(1)"

[[class_rule]]
id = "C17-other-items"
when = { entity_type = ["other_cash", "other_gold", "other_items_in_collection", "other_tangible", "other_residual_lease"] }
verdict = "other"
sourcing = "regulation"
citation = "CRR Art. 112(1)(q), Art. 134; CRR Art. 147(2)(g)"

# ===========================================================================
# approach — CRR Art. 143/150/151/153, PS1/26 Art. 147A(1)
# ===========================================================================

[[approach_rule]]
id = "A0-equity"
when = { entity_type = "equity" }
verdict = "equity"
sourcing = "scope"
citation = "CRR Art. 155; PS1/26 Art. 147A(1)(h)"
note = """
`equity` is the engine's own approach label for the equity treatment, not a
claim about SA-vs-IRB: PS1/26 Art. 147A(1)(h) makes equity Standardised-only
from 1 January 2027, while CRR Art. 155 still admits the simple-risk-weight,
PD/LGD and internal-models IRB equity approaches. The label routes to whichever
of those the regime supports.
"""

[[approach_rule]]
id = "A1-no-internal-estimate"
when = { irb_inputs = "none" }
verdict = "standardised"
sourcing = "regulation"
citation = "CRR Art. 143(1), Art. 144(1)(a); PS1/26 Art. 147A(1) (Standardised limbs)"
note = """
The IRB Approach is a permission to use the institution's OWN estimates of PD.
With no internal rating there is no own PD estimate and no rating system to
which a permission could attach, so the Standardised Approach applies. This
includes the slotting flavour: slotting is an IRB treatment, and the engine
resolves the Art. 143 permission from a model id supplied either on an internal
rating or as the counterparty's `internal_model_id`; the generated baseline
carries neither.
"""

[[approach_rule]]
id = "A2-b31-sovereign-like"
when = { regime = "B31", entity_type = ["sovereign", "central_bank", "central_bank_ecb", "rgla_sovereign", "rgla_institution", "pse_sovereign", "pse_institution", "mdb", "mdb_named", "international_org"] }
verdict = "standardised"
sourcing = "regulation"
citation = "PS1/26 Art. 147A(1)(a), read with Art. 147(3)(a)-(g)"
note = """
Verbatim: "(a) for point (a) of Article 147(2) (central governments, central
banks or quasi-sovereigns), the Standardised Approach". Unlike every other limb
of Art. 147A(1), (a) offers no IRB alternative at all.
"""

[[approach_rule]]
id = "A3-slotting-advanced"
when = { flavour = "slotting", irb_inputs = "pd_lgd" }
verdict = "advanced_irb"
sourcing = "regulation"
citation = "CRR Art. 153(1)-(4); PS1/26 Art. 147A(1)(d)(iii)"
note = """
The generated specialised-lending record is PROJECT FINANCE, which PS1/26
Art. 147A(1)(d) leaves open to F-IRB and A-IRB; only IPRE and HVCRE are
slotting-only under Art. 147A(1)(c)(ii). With both an own PD and an own LGD the
A-IRB limb (d)(iii) applies.
"""

[[approach_rule]]
id = "A4-slotting-pd-only"
when = { flavour = "slotting", irb_inputs = "pd" }
verdict = "slotting"
sourcing = "regulation"
citation = "CRR Art. 153(5); PS1/26 Art. 147A(1)(d)(iv)"
note = """
CRR Art. 153(5) supplies the slotting categories for specialised lending where
the institution cannot estimate PD to the Art. 153(1) standard; PS1/26
Art. 147A(1)(d)(iv) makes Slotting the residual for object / project /
commodities finance. Without an own LGD estimate the A-IRB limb is unavailable.
"""

[[approach_rule]]
id = "A5-b31-institution-firb"
when = { regime = "B31", entity_type = ["institution", "bank", "financial_institution", "ccp"] }
verdict = "foundation_irb"
sourcing = "regulation"
citation = "PS1/26 Art. 147A(1)(b)(ii)"
note = """
Verbatim: "(b) for point (b) of Article 147(2) (institutions): ... (ii) the
Foundation IRB Approach for all other exposures within that exposure class."
There is no A-IRB limb for institutions under Basel 3.1.
"""

[[approach_rule]]
id = "A6-b31-retail-airb"
when = { regime = "B31", entity_type = ["individual", "retail", "natural_person"], irb_inputs = "pd_lgd" }
verdict = "advanced_irb"
sourcing = "regulation"
citation = "PS1/26 Art. 147A(1)(g)(ii)"

[[approach_rule]]
id = "A7-b31-retail-no-lgd"
when = { regime = "B31", entity_type = ["individual", "retail", "natural_person"], irb_inputs = "pd" }
verdict = "standardised"
sourcing = "convention"
citation = "PS1/26 Art. 147A(1)(g); CRR Art. 151(4)"
note = """
Art. 147A(1)(g) offers only two limbs — Standardised where an Art. 148/150
permission has been granted, and A-IRB "for all other exposures". A-IRB requires
own LGD estimates (CRR Art. 151(4): for retail exposures institutions shall use
own estimates of LGD), so a retail exposure with a PD but no LGD estimate is a
DATA state the article does not contemplate. Falling back to Standardised is the
engine's convention for it.
"""

[[approach_rule]]
id = "A8-b31-large-corporate-firb"
when = { regime = "B31", entity_type = ["corporate", "company", "specialised_lending"], size_band = "large" }
verdict = "foundation_irb"
sourcing = "regulation"
citation = "PS1/26 Art. 147(4C)(b)(ii), Art. 147A(1)(e)(ii)"
note = """
Art. 147(4C)(b)(ii) assigns to the financial-and-large-corporates SUBCLASS any
corporate with "annual revenue of more than GBP 440 million"; Art. 147A(1)(e)
then gives that subclass the Foundation IRB Approach "for all other exposures
within that exposure subclass" — there is no A-IRB limb. The test is on the
exposure being to a corporate with that revenue, not on which of the engine's
interchangeable corporate entity-type labels the input happens to use.
"""

[[approach_rule]]
id = "A9-b31-corporate-unknown-size-firb"
when = { regime = "B31", entity_type = ["corporate", "company", "specialised_lending"], size_band = "none" }
verdict = "foundation_irb"
sourcing = "convention"
citation = "PS1/26 Art. 147(4C)(b)(ii), Art. 147A(1)(e)(ii)"
note = """
Art. 147(4C)(b)(ii) is silent on a corporate whose revenue is unknown. The engine
treats an unresolvable size as large — the conservative direction, since F-IRB's
supervisory LGD is normally above an own estimate — and emits CLS008 so the data
gap is visible. Recorded as a convention: the disagreement worth reporting here
is any INCONSISTENCY in applying it across the corporate entity-type aliases.
"""

[[approach_rule]]
id = "A10-b31-corporate-sme-airb"
when = { regime = "B31", entity_type = ["corporate", "company", "specialised_lending"], size_band = "sme", irb_inputs = "pd_lgd" }
verdict = "advanced_irb"
sourcing = "regulation"
citation = "PS1/26 Art. 147A(1)(f)(ii)"

[[approach_rule]]
id = "A11-b31-corporate-sme-firb"
when = { regime = "B31", entity_type = ["corporate", "company", "specialised_lending"], size_band = "sme", irb_inputs = "pd" }
verdict = "foundation_irb"
sourcing = "regulation"
citation = "PS1/26 Art. 147A(1)(f)(iii)"

[[approach_rule]]
id = "A12-crr-retail-airb"
when = { regime = "CRR", entity_type = ["individual", "retail", "natural_person"], irb_inputs = "pd_lgd" }
verdict = "advanced_irb"
sourcing = "regulation"
citation = "CRR Art. 151(4), Art. 154"

[[approach_rule]]
id = "A13-crr-retail-no-lgd"
when = { regime = "CRR", entity_type = ["individual", "retail", "natural_person"], irb_inputs = "pd" }
verdict = "standardised"
sourcing = "convention"
citation = "CRR Art. 151(4)"
note = "See A7 — CRR Art. 151(4) likewise admits no supervisory-LGD retail limb."

[[approach_rule]]
id = "A14-own-lgd-advanced"
when = { irb_inputs = "pd_lgd" }
verdict = "advanced_irb"
sourcing = "regulation"
citation = "CRR Art. 143(1), Art. 151(1), Art. 151(8); PS1/26 Art. 147A(1)(f)(ii)"
note = """
Residual limb for every combination not caught above: with an own PD and an own
LGD, and a permission covering the class, the Advanced IRB Approach applies.
"""

[[approach_rule]]
id = "A15-pd-only-foundation"
when = { irb_inputs = "pd" }
verdict = "foundation_irb"
sourcing = "regulation"
citation = "CRR Art. 143(1), Art. 151(1), Art. 161(1); PS1/26 Art. 147A(1)(b)(ii), (e)(ii), (f)(iii)"
note = """
Residual limb: an own PD with supervisory LGD values is the Foundation IRB
Approach.
"""

# ===========================================================================
# Known disagreements — combinations where the engine is believed WRONG.
#
# Each is attached as a strict xfail so that FIXING the engine turns the suite
# red and forces the entry to be removed deliberately. Never widen one of these
# to silence a new failure.
# ===========================================================================

[[known_disagreement]]
id = "D1-qrre-aggregate-double-counts-a-split-facility"
field = "exposure_class_irb"
when = { entity_type = ["individual", "retail", "natural_person"], flavour = "revolving_qrre_headroom" }
expected = "retail_qrre"
observed = "retail_other"
citation = "CRR Art. 154(4)(c); PS1/26 Art. 147(5A)(c)"
detail = """
The per-individual QRRE aggregate is computed as the SUM of `facility_limit`
over the obligor's candidate rows. A revolving facility with any undrawn
headroom is split by the hierarchy stage into a drawn child and a synthetic
`_UNDRAWN` leg, and BOTH legs carry the parent's `facility_limit`, so one
GBP 70,000 card is measured at GBP 140,000. Art. 154(4)(c) / Art. 147(5A)(c)
measure "the largest aggregate nominal exposure to a single individual" — a
property of the obligor's facilities, not of how the engine splits them into
legs. Measured here: the same obligor with the same GBP 70,000 facility is
retail_qrre when drawn to the limit and retail_other with GBP 20,000 of
headroom. Consequence: essentially every partially-drawn credit card is denied
the Art. 154(4) QRRE correlation and disappears from the COREP C 08.xx and
Pillar 3 CR6 QRRE rows. The fully-drawn shape is the only one the existing
reporting fixture builds, which is why it has never surfaced
(.claude/LESSONS.md B5).
"""

[[known_disagreement]]
id = "D1b-qrre-double-count-reaches-the-routing-carrier"
field = "exposure_class"
when = { entity_type = ["individual", "retail", "natural_person"], flavour = "revolving_qrre_headroom" }
expected = "retail_qrre"
observed = "retail_other"
citation = "CRR Art. 154(4)(c); PS1/26 Art. 147(5A)(c)"
detail = """
The same defect as D1, on the carrier that actually decides the treatment: the
routing `exposure_class` the IRB correlation, the COREP C 08.xx sheet split and
the Pillar 3 CR6 row axis all read. D1 records the reported IRB class; this
records that the partially-drawn card is also CALCULATED as other retail, so the
Art. 154(1) retail correlation curve is used where Art. 154(4)'s flat 0.04
belongs. Both entries stand or fall together and must be removed together.
"""

[[known_disagreement]]
id = "D2-large-corporate-test-keys-on-one-entity-type-string"
field = "approach"
when = { regime = "B31", entity_type = ["company", "specialised_lending"], size_band = ["large", "none"], irb_inputs = "pd_lgd", flavour = ["plain", "mortgage", "revolving_qrre", "revolving_qrre_headroom", "defaulted"] }
expected = "foundation_irb"
observed = "advanced_irb"
citation = "PS1/26 Art. 147(4C)(b)(ii), Art. 147A(1)(e)(ii)"
detail = """
The Art. 147(4C)(b)(ii) large-corporate test is gated on the literal string
`cp_entity_type == "corporate"`, so the other entity types that map to the
corporate exposure class — `company` and `specialised_lending` — escape it. A
GBP 600m-revenue obligor typed `company` receives A-IRB where the identical
obligor typed `corporate` correctly receives F-IRB, and the same split applies
to the unknown-revenue conservative default. Direction: RWA-REDUCING, because
A-IRB's own LGD estimate is normally below the Art. 161(1)(aa) 40% / (a) 45%
supervisory values. The same one-string gate is not used elsewhere: the ADC
corporate gate in `attributes.py` tests `["corporate", "company",
"specialised_lending"]`, and the class map sends all three to CORPORATE.
"""

[[known_disagreement]]
id = "D3-irb-class-overwritten-by-the-sa-class"
field = "exposure_class_irb"
when = { entity_type = ["mdb_named", "international_org"] }
expected = "central_govt_central_bank"
observed = "mdb / international_organisation"
citation = "CRR Art. 147(3)(b), Art. 147(3)(c), Art. 117(2), Art. 118; PS1/26 Art. 147(3)(f)-(g)"
detail = """
The entity-type map derives the correct Art. 147(3) IRB class
(central_govt_central_bank) for named MDBs and international organisations, and
`sync_irb_exposure_class` then OVERWRITES it with the Standardised class. Only
rgla_* / pse_* (and, under CRR only, non-named `mdb`) are on the preserve list.
The result is an `exposure_class_irb` of `mdb` / `international_organisation` —
neither of which is an Art. 147(2) exposure class. Consequence under CRR: the
model-permission lookup keys on `exposure_class_irb`, so an Art. 117(2) MDB
cannot match a permission granted for the central-government class and is
forced to Standardised however complete its IRB permission. Under Basel 3.1 the
routing consequence is masked by Art. 147A(1)(a).
"""

[[known_disagreement]]
id = "D4-b31-quasi-sovereign-irb-class-still-institution"
field = "exposure_class_irb"
when = { regime = "B31", entity_type = ["rgla_institution", "pse_institution", "mdb"] }
expected = "central_govt_central_bank"
observed = "institution"
citation = "PS1/26 Art. 147(3)(c), (d), (e), (f)"
detail = """
PS1/26 Art. 147(3) assigns regional governments, local authorities, public
sector entities and MDBs to the Art. 147(2)(a) central-government class
unconditionally; the CRR-era Art. 147(4)(a)-(c) "treated as institutions"
routing has no PS1/26 counterpart. The engine's base map is
framework-invariant, and only the APPROACH consequence is regime-gated (the
`b31_sa_only` blocker in `approach.py`), so the reported IRB class stays
`institution` under Basel 3.1. Consequence in the tested configuration: label
only, because Art. 147A(1)(a) forces these rows Standardised either way. It
becomes number-changing the moment a permission, a floor or a correlation is
keyed on the IRB class for these obligors.
"""

[[known_disagreement]]
id = "D5-instrument-classes-in-the-irb-codomain"
field = "exposure_class_irb"
when = { entity_type = ["covered_bond", "high_risk", "high_risk_venture_capital", "high_risk_private_equity", "high_risk_speculative_re"] }
expected = "corporate"
observed = "covered_bond / high_risk / other"
citation = "CRR Art. 147(2), Art. 147(7); PS1/26 Art. 147(2), Art. 147(4A)"
detail = """
`covered_bond` and `high_risk` are Standardised-Approach classes (CRR
Art. 112(1)(l) and (k)) with no counterpart in either Art. 147(2) enumeration,
yet they are emitted as `exposure_class_irb` values. The residual limb — CRR
Art. 147(7) / PS1/26 Art. 147(4A) — assigns any credit obligation outside
points (a), (b), (d), (e), (ea) and (f) to the corporate class. Which Art. 147(2)
class is right for a covered bond is arguable (see IRB15); that these values are
not Art. 147(2) classes at all is not. Consequence: no model permission can be
keyed on them, so an IRB-permissioned firm's covered-bond holding is forced to
Standardised.
"""

[[known_disagreement]]
id = "D6-named-mdb-and-international-organisation-cannot-reach-irb-under-crr"
field = "approach"
when = { regime = "CRR", entity_type = ["mdb_named", "international_org"], irb_inputs = ["pd", "pd_lgd"] }
expected = "foundation_irb (PD only) / advanced_irb (PD and own LGD)"
observed = "standardised"
citation = "CRR Art. 147(3)(b)-(c), Art. 117(2), Art. 118; CRR Art. 143(1), Art. 151(1)"
detail = """
The measurable consequence of D3. CRR Art. 147(3)(b)-(c) place Art. 117(2)
multilateral development banks and 0%-risk-weighted international organisations
in the Art. 147(2)(a) central-government exposure class. Model permissions are
matched on `exposure_class_irb`, which `sync_irb_exposure_class` has overwritten
with the Standardised class (`mdb` / `international_organisation`), so a
permission granted for the central-government class cannot match and the row is
routed Standardised. Measured: an obligor with an internal PD, an own LGD and a
central-government A-IRB permission receives `standardised`. Under Basel 3.1 the
same rows are Standardised for an unrelated and correct reason
(Art. 147A(1)(a)), which is why the defect only bites the CRR arm.
"""

[[known_disagreement]]
id = "D7-covered-bond-cannot-reach-irb"
field = "approach"
when = { entity_type = "covered_bond", irb_inputs = ["pd", "pd_lgd"] }
expected = "foundation_irb (PD only) / advanced_irb (PD and own LGD)"
observed = "standardised"
citation = "CRR Art. 147(2), Art. 147(7); PS1/26 Art. 147(2), Art. 147(4A); CRR Art. 143(1)"
detail = """
The measurable consequence of D5 for covered bonds, in BOTH regimes. Whichever
Art. 147(2) class a covered bond belongs to — (b) institutions where the issuer
is a credit institution, or the corporate residual under Art. 147(7) /
Art. 147(4A) — the firm holds an IRB permission for it in this configuration.
Because `exposure_class_irb` carries the Standardised-only value `covered_bond`,
no permission row can match and the exposure is routed Standardised however
complete the permission. Unlike D6 this is not masked under Basel 3.1: covered
bonds are not quasi-sovereign, so Art. 147A(1)(a) does not apply and there is no
correct reason for the Standardised outcome.
"""
